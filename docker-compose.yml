services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dstn}
      POSTGRES_USER: ${POSTGRES_USER:-dstn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dstn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dstn -d dstn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-redis-pw}
    ports:
      - "127.0.0.1:6379:6379"

  issuer-agent:
    build:
      context: services/issuer
      dockerfile: Dockerfile
    environment:
      ACAPY_WALLET_KEY: ${ACAPY_WALLET_KEY:-change-wallet-key}
      STRATOS_GENESIS_URL: ${STRATOS_GENESIS_URL}
      STRATOS_API_URL: ${STRATOS_API_URL}
      STRATOS_API_KEY: ${STRATOS_API_KEY}
      ISSUER_AGENT_API_KEY: ${ISSUER_AGENT_API_KEY:-change-me}
    ports:
      - "8020:8020"
      - "8021:8021"
    depends_on:
      - postgres

volumes:
  pgdata:
