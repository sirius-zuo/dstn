apiVersion: apps/v1
kind: Deployment
metadata:
  name: das
  namespace: dstn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: das
  template:
    metadata:
      labels:
        app: das
    spec:
      containers:
      - name: das
        image: ghcr.io/stratos/dstn-das:latest
        command: ["python", "-m", "das.main"]
        envFrom:
        - configMapRef:
            name: dstn-config
        - secretRef:
            name: dstn-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
